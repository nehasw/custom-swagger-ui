<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Portal</title>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">

  <script>
    try {
      var t = (JSON.parse(localStorage.getItem('apiPortal.prefs')) || {}).theme;
      if (t) document.documentElement.dataset.theme = t;
      else if (matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) { }
  </script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app" id="app" data-sidebar="expanded">

    <header class="topbar">

      <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle navigation" aria-controls="sidebar"
        aria-expanded="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <div class="brand">
        <span class="brand-mark" aria-hidden="true">{ }</span>

        <div>
          <span class="brand-title" id="app-title">API Portal</span>
          <span class="brand-version" id="app-version"></span>
        </div>
      </div>

      <div class="topbar-spacer"></div>

      <div class="search" role="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>

        <input class="input" id="global-search" type="search" placeholder="Search APIs, paths, methods"
          autocomplete="off" aria-label="Search APIs" disabled>

        <kbd aria-hidden="true">/</kbd>
      </div>

      <label>
        <span class="sr-only">Environment</span>
        <select class="select" id="env-select"></select>
      </label>

      <button class="btn auth-btn" id="auth-btn" data-state="locked" type="button">

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

          <rect x="4" y="11" width="16" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>

        <span id="auth-label">Authorize</span>
      </button>

      <button class="icon-btn" id="theme-toggle" aria-label="Toggle light/dark theme" type="button">

        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>

    </header>

    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-inner" id="nav" aria-label="API navigation">

        <div class="nav-group" aria-hidden="true">
          <div class="skeleton" style="width:40%;margin:8px">
          </div>

          <div class="skeleton" style="width:88%;margin:10px 8px">
          </div>

          <div class="skeleton" style="width:76%;margin:10px 8px">
          </div>

          <div class="skeleton" style="width:82%;margin:10px 8px">
          </div>
        </div>

      </nav>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main" id="main" tabindex="-1">

      <div class="view" id="view">

        <div class="card empty-state">
          <h2>Waiting for the API definition</h2>

          <p>
            The portal shell is ready. Endpoints will appear here once
            the OpenAPI spec is loaded.
          </p>
        </div>

      </div>

    </main>

  </div>

  <script type="module" src="js/app.js"></script>

</body>

</html>
